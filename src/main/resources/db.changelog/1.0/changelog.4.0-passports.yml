databaseChangeLog:
  - changeSet:
      id: 4-create-passports
      author: elnur.ahmadov
      changes:
        - createTable:
            tableName: passports
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
              - column:
                  name: passport_number
                  type: VARCHAR(50)
              - column:
                  name: issue_date
                  type: DATE
              - column:
                  name: expiry_date
                  type: DATE
              - column:
                  name: country
                  type: VARCHAR(100)
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP

        - addPrimaryKey:
            tableName: passports
            columnNames: id
            constraintName: pk_passports