databaseChangeLog:
  - changeSet:
      id: 2-create-destinations
      author: elnur.ahmadov
      changes:
        - createTable:
            tableName: destinations
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: location
                  type: TEXT
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: TEXT
              - column:
                  name: visit_date
                  type: DATE
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValue: now()
              - column:
                  name: updated_at
                  type: TIMESTAMP
              - column:
                  name: tour_id
                  type: BIGINT
                  constraints:
                    foreignKeyName: fk_destinations_tours
                    references: tours(id)
                    nullable: false