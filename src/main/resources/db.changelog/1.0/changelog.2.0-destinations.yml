databaseChangeLog:
  - changeSet:
      id: 2-create-destinations
      author: elnur.ahmadov
      changes:
        - createTable:
            tableName: destinations
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
              - column:
                  name: location
                  type: VARCHAR(255)
              - column:
                  name: description
                  type: TEXT
              - column:
                  name: visit_date
                  type: DATE
              - column:
                  name: tour_id
                  type: BIGINT
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP

        - addPrimaryKey:
            tableName: destinations
            columnNames: id
            constraintName: pk_destinations

        - addForeignKeyConstraint:
            baseTableName: destinations
            baseColumnNames: tour_id
            referencedTableName: tours
            referencedColumnNames: id
            constraintName: fk_destinations_tour