databaseChangeLog:
  - changeSet:
      id: 6-create-tour-guides
      author: elnur.ahmadov
      changes:
        - createTable:
            tableName: tour_guides
            columns:
              - column:
                  name: tour_id
                  type: BIGINT
              - column:
                  name: guide_id
                  type: BIGINT

        - addPrimaryKey:
            tableName: tour_guides
            columnNames: tour_id, guide_id
            constraintName: pk_tour_guides

        - addForeignKeyConstraint:
            baseTableName: tour_guides
            baseColumnNames: tour_id
            referencedTableName: tours
            referencedColumnNames: id
            constraintName: fk_tour_guides_tour

        - addForeignKeyConstraint:
            baseTableName: tour_guides
            baseColumnNames: guide_id
            referencedTableName: guides
            referencedColumnNames: id
            constraintName: fk_tour_guides_guide