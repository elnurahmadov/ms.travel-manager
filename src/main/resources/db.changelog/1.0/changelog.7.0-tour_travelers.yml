databaseChangeLog:
  - changeSet:
      id: 7-create-tour-travelers
      author: elnur.ahmadov
      changes:
        - createTable:
            tableName: tour_travelers
            columns:
              - column:
                  name: tour_id
                  type: BIGINT
              - column:
                  name: traveler_id
                  type: BIGINT

        - addPrimaryKey:
            tableName: tour_travelers
            columnNames: tour_id, traveler_id
            constraintName: pk_tour_travelers

        - addForeignKeyConstraint:
            baseTableName: tour_travelers
            baseColumnNames: tour_id
            referencedTableName: tours
            referencedColumnNames: id
            constraintName: fk_tour_travelers_tour

        - addForeignKeyConstraint:
            baseTableName: tour_travelers
            baseColumnNames: traveler_id
            referencedTableName: travelers
            referencedColumnNames: id
            constraintName: fk_tour_travelers_traveler